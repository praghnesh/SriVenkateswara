<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Brand Emblem Mark -->
  <g transform="translate(4, 4)">
    <!-- Shield / Hexagon Gradient Container -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#brandGrad)" />
    <!-- Outer Glow Stroke -->
    <rect x="1" y="1" width="54" height="54" rx="13" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    
    <!-- Stylized SV Monogram + Chariot / Winged Car Accent -->
    <path d="M16 19 L28 40 L40 19" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M22 28 L28 17 L34 28" fill="#F59E0B" />
    <!-- Divine Tilak / Golden Feather Crest Accent -->
    <circle cx="28" cy="14" r="2.5" fill="#F59E0B" />
    <!-- Dynamic Speed Line under V -->
    <path d="M12 42 Q28 47 44 42" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: Sri Venkateswara Car Travels -->
  <text x="70" y="27" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="19" font-weight="800" fill="#0F172A" letter-spacing="-0.02em">
    SRI VENKATESWARA
  </text>
  <text x="71" y="44" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="11.5" font-weight="700" fill="#D97706" letter-spacing="0.14em">
    CAR TRAVELS &amp; CABS
  </text>
  <text x="71" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="0.08em">
    GUNTUR • VIJAYAWADA • 24/7 SERVICE
  </text>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
</svg>
